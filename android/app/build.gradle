apply plugin: 'com.android.application'

def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version

def accountRuntime = rootProject.file(providers.gradleProperty('deepSeekRuntimeDir')
        .getOrElse('../.toolchain/harness-probe/deploy'))
def accountNative = rootProject.file(providers.gradleProperty('deepSeekRuntimeJniDir')
        .getOrElse('../.toolchain/harness-probe/android-probe/app/src/main/jniLibs'))
apply from: 'account-harness.gradle'

abstract class PrepareAccountAssets extends DefaultTask {
    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()
}

def originalHarness = new File(accountRuntime, 'harness.zip')
def accountLibraries = ['libnode.so', 'libdshengine.so', 'libc++_shared.so'].collect {
    new File(accountNative, "arm64-v8a/$it")
}
def trimAccountHarness = !providers.gradleProperty('deepSeekHarnessDedupOnly').isPresent()
def prepareAccountAssets = tasks.register('prepareAccountAssets', PrepareAccountAssets) {
    outputDirectory.set(layout.buildDirectory.dir('generated/deepseekAccountAssets'))
    inputs.file(originalHarness).withPathSensitivity(PathSensitivity.NONE)
    inputs.file('account-harness.gradle').withPathSensitivity(PathSensitivity.NONE)
    inputs.files(accountLibraries).withPathSensitivity(PathSensitivity.NAME_ONLY)
    inputs.property('trim', trimAccountHarness)
    doLast {
        if (!accountLibraries.every { it.isFile() }) {
            throw new GradleException('Missing DeepSeek arm64-v8a libraries. Supply deepSeekRuntimeJniDir.')
        }
        packAccountHarness(originalHarness, outputDirectory.file('deepseek-runtime/harness.zip').get().asFile, trimAccountHarness)
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(prepareAccountAssets, { it.outputDirectory })
    }
}

android {
    sourceSets.main.jniLibs.srcDir(accountNative)
    packaging.jniLibs.useLegacyPackaging = true
    namespace = "app.deepchat.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.deepchat.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            // 优先使用工作区内生成的调试密钥（keytool 标准参数，见 README）；
            // 缺失时回退到 AGP 默认调试密钥（~/.android/debug.keystore，首次构建自动生成）。
            def keystore = rootProject.file('../.toolchain/debug.keystore')
            if (keystore.exists()) {
                storeFile keystore
            }
        }
    }
    buildTypes {
        debug {
            if (providers.gradleProperty('deepChatIsolatedTest').isPresent()) {
                applicationIdSuffix '.isolatedtest'
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation 'androidx.browser:browser:1.9.0'
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
